<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>덤벨 팔 운동 가이드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans KR', sans-serif; background: #0f0f13; color: #f0ede8; min-height: 100vh; }
.app { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 24px; }

.header { padding: 20px 20px 12px; }
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.4px; }
.header .subtitle { font-size: 12px; color: #666; margin-top: 3px; }

.chip-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; padding: 0 20px 16px; }
.chip { padding: 8px 6px; border-radius: 20px; font-size: 12px; font-weight: 500;
  cursor: pointer; border: 1.5px solid #2a2a35; background: #1a1a22; color: #888;
  transition: background .2s, color .2s, border-color .2s; text-align: center; white-space: nowrap; }
.chip.active { background: #e8ff6b; color: #0f0f13; border-color: #e8ff6b; }

.ex-view { padding: 0 20px; }
.ex-image { width: 100%; border-radius: 16px; overflow: hidden; background: #1e1e26;
  aspect-ratio: 4/3; display: flex; align-items: center; justify-content: center; }
.ex-image img { width: 100%; height: 100%; object-fit: contain; display: block; }

.ex-info { margin-top: 14px; }
.ex-num { font-size: 11px; color: #e8ff6b; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 3px; }
.ex-name { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
.ex-sub { font-size: 13px; color: #666; margin-top: 3px; }

.timer-wrap { margin-top: 22px; }
.sets-row { display: flex; gap: 7px; margin-bottom: 14px; align-items: center; }
.set-label { font-size: 11px; color: #555; margin-right: 2px; }
.set-dot { width: 28px; height: 5px; border-radius: 3px; background: #2a2a35; transition: background .3s; }
.set-dot.done { background: #e8ff6b; }
.set-dot.active { background: #fff; }

.phase-label { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 2px;
  margin-bottom: 10px; height: 16px; }
.phase-label.ready { color: #ff4d4d; }
.phase-label.ex    { color: #e8ff6b; }
.phase-label.rest  { color: #6bc5e8; }
.phase-label.idle  { color: #555; }

.ring-wrap { position: relative; width: 160px; height: 160px; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center; }
.ring-wrap svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
.ring-wrap circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.ring-bg   { stroke: #2a2a35; }
.ring-prog { stroke: #e8ff6b; transition: stroke-dashoffset .15s linear, stroke .3s; }
.ring-inner { text-align: center; }
.ring-num  { font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -3px; }
.ring-unit { font-size: 12px; color: #666; margin-top: 2px; }

.controls { display: flex; gap: 10px; }
.btn-nav  { width: 52px; height: 54px; border-radius: 14px; border: 1.5px solid #2a2a35;
  background: #1a1a22; color: #f0ede8; font-size: 20px; cursor: pointer;
  transition: transform .1s; display: flex; align-items: center; justify-content: center; }
.btn-nav:active { transform: scale(.93); }
.btn-main { flex: 1; height: 54px; border-radius: 14px; border: none;
  font-size: 17px; font-weight: 700; cursor: pointer; letter-spacing: -0.3px;
  background: #e8ff6b; color: #0f0f13; transition: transform .1s; }
.btn-main:active { transform: scale(.97); }

.completion { display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 20px 40px; text-align: center; }
.completion.show { display: flex; }
.completion .big-emoji { font-size: 64px; margin-bottom: 18px; }
.completion h2 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
.completion p  { font-size: 14px; color: #888; line-height: 1.7; margin-bottom: 36px; }
.btn-restart { padding: 16px 40px; border-radius: 14px; border: none; font-size: 16px;
  font-weight: 700; background: #e8ff6b; color: #0f0f13; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>덤벨 팔 운동 🏋️</h1>
    <div class="subtitle">6가지 동작 &nbsp;·&nbsp; 15초 운동 &nbsp;·&nbsp; 5초 휴식 &nbsp;·&nbsp; 4세트</div>
  </div>

  <div class="chip-row" id="chipRow"></div>

  <div class="ex-view" id="mainView">
    <div class="ex-image">
      <img id="exImg" src="" alt="">
    </div>
    <div class="ex-info">
      <div class="ex-num"  id="exNum">운동 1 / 6</div>
      <div class="ex-name" id="exName"></div>
      <div class="ex-sub"  id="exSub"></div>
    </div>

    <div class="timer-wrap">
      <div class="sets-row">
        <span class="set-label">세트</span>
        <div class="set-dot" id="dot0"></div>
        <div class="set-dot" id="dot1"></div>
        <div class="set-dot" id="dot2"></div>
        <div class="set-dot" id="dot3"></div>
      </div>

      <div class="phase-label idle" id="phaseLabel">준비 중</div>

      <div class="ring-wrap">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle class="ring-bg"   cx="80" cy="80" r="70"/>
          <circle class="ring-prog" cx="80" cy="80" r="70" id="ringProg"
            stroke-dasharray="439.82" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-inner">
          <div class="ring-num" id="ringNum">15</div>
          <div class="ring-unit">초</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn-nav"  id="btnPrev" onclick="navEx(-1)">&#8592;</button>
        <button class="btn-main" id="btnMain" onclick="toggleTimer()">시작</button>
        <button class="btn-nav"  id="btnNext" onclick="navEx(1)">&#8594;</button>
      </div>
    </div>
  </div>

  <div class="completion" id="completionView">
    <div class="big-emoji">🎉</div>
    <h2>운동 완료!</h2>
    <p>6가지 동작을 모두 마쳤어요.<br>오늘도 정말 수고했습니다!</p>
    <button class="btn-restart" onclick="resetAll()">처음부터 다시</button>
  </div>
</div>

const CIRC       = 439.82;
const EX_TIME    = 15;
const REST_TIME  = 5;
const READY_TIME = 5;
const TOTAL_SETS = 4;

let curEx   = 0;
let curSet  = 0;
let phase   = 'idle';   // idle | ready | exercise | rest | paused
let timeLeft = EX_TIME;
let timerId  = null;
let pausedPhase = null;

// ── 오디오 (모바일 대응) ──────────────────────────────────────────────────────
// 전략: Web Audio API + AudioContext를 사용해 모바일 잠금 해제 후 벨 소리 재생
let _audioCtx = null;
let _beepBuffer = null;
let _audioReady = false;

function _getAudioCtx() {
  if (!_audioCtx) {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return _audioCtx;
}

// base64 → ArrayBuffer 변환
function _base64ToArrayBuffer(base64) {
  const bin = atob(base64.split(',')[1]);
  const buf = new ArrayBuffer(bin.length);
  const view = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
  return buf;
}

// 반드시 버튼 클릭 핸들러 안에서 동기적으로 호출 (모바일 AudioContext 활성화)
function unlockAudio() {
  const ctx = _getAudioCtx();

  // suspended 상태면 resume (iOS Safari 필수)
  if (ctx.state === 'suspended') {
    ctx.resume().then(() => console.log('AudioContext resumed ✓'));
  }

  // 벨 소리 버퍼가 아직 없으면 디코딩
  if (!_beepBuffer) {
    try {
      const arrayBuf = _base64ToArrayBuffer(BEEP_SRC);
      ctx.decodeAudioData(arrayBuf, (decoded) => {
        _beepBuffer = decoded;
        _audioReady = true;
        console.log('beep buffer ready ✓');
      }, (err) => {
        console.warn('decodeAudioData failed:', err);
        _audioReady = false;
      });
    } catch(e) {
      console.warn('audio init failed:', e);
    }
  }
}

function beep() {
  // Web Audio API로 재생 시도
  if (_audioReady && _beepBuffer && _audioCtx) {
    try {
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
      const src = _audioCtx.createBufferSource();
      src.buffer = _beepBuffer;
      src.connect(_audioCtx.destination);
      src.start(0);
      return;
    } catch(e) {
      console.warn('WebAudio beep failed:', e);
    }
  }
  // 폴백: HTMLAudio
  try {
    const a = new Audio(BEEP_SRC);
    a.currentTime = 0;
    const p = a.play();
    if (p !== undefined) p.catch(e => console.warn('audio fallback blocked:', e));
  } catch(e) { console.warn('beep err:', e); }
}

// ── chips ─────────────────────────────────────────────────────────────────────
function buildChips() {
  const row = document.getElementById('chipRow');
  EXERCISES.forEach((ex, i) => {
    const d = document.createElement('div');
    d.className = 'chip' + (i === 0 ? ' active' : '');
    d.id = 'chip' + i;
    d.textContent = ex.name;
    d.onclick = () => {
      unlockAudio();
      clearInterval(timerId); timerId = null;
      phase = 'idle'; curSet = 0; timeLeft = EX_TIME;
      curEx = i;
      render();
    };
    row.appendChild(d);
  });
}

// ── render ────────────────────────────────────────────────────────────────────
function render() {
  const ex = EXERCISES[curEx];
  document.getElementById('exImg').src  = IMG_DATA[curEx];
  document.getElementById('exImg').alt  = ex.name;
  document.getElementById('exNum').textContent  = '운동 ' + (curEx+1) + ' / ' + EXERCISES.length;
  document.getElementById('exName').textContent = ex.name;
  document.getElementById('exSub').textContent  = ex.sub;
  EXERCISES.forEach((_, i) => {
    document.getElementById('chip'+i).className = 'chip' + (i === curEx ? ' active' : '');
  });
  updateDots();
  updateTimer();
}

function updateDots() {
  for (let i = 0; i < TOTAL_SETS; i++) {
    const d = document.getElementById('dot'+i);
    d.className = 'set-dot' + (i < curSet ? ' done' : i === curSet ? ' active' : '');
  }
}

function updateTimer() {
  const lbl  = document.getElementById('phaseLabel');
  const num  = document.getElementById('ringNum');
  const prog = document.getElementById('ringProg');
  const btn  = document.getElementById('btnMain');
  num.textContent = timeLeft;

  let total, stroke, labelText, labelClass, btnText;
  if (phase === 'ready') {
    total = READY_TIME; stroke = '#ff4d4d';
    labelText = '준비 🔴'; labelClass = 'ready'; btnText = '일시정지';
  } else if (phase === 'exercise') {
    total = EX_TIME; stroke = '#e8ff6b';
    labelText = '운동 중 💪'; labelClass = 'ex'; btnText = '일시정지';
  } else if (phase === 'rest') {
    total = REST_TIME; stroke = '#6bc5e8';
    labelText = '휴식 중 😮‍💨'; labelClass = 'rest'; btnText = '일시정지';
  } else if (phase === 'paused') {
    total = pausedPhase === 'ready' ? READY_TIME : pausedPhase === 'exercise' ? EX_TIME : REST_TIME;
    stroke = pausedPhase === 'ready' ? '#ff4d4d' : pausedPhase === 'exercise' ? '#e8ff6b' : '#6bc5e8';
    labelText = '일시정지'; labelClass = 'idle'; btnText = '재개';
  } else {
    total = EX_TIME; stroke = '#e8ff6b';
    labelText = '준비 중'; labelClass = 'idle'; btnText = '시작';
  }

  prog.style.stroke = stroke;
  prog.setAttribute('stroke-dashoffset', String(CIRC * (1 - timeLeft / total)));
  lbl.textContent = labelText;
  lbl.className = 'phase-label ' + labelClass;
  btn.textContent = btnText;
}

// ── timer ─────────────────────────────────────────────────────────────────────
function toggleTimer() {
  unlockAudio(); // 반드시 사용자 제스처 안에서 호출
  if (phase === 'idle') {
    phase = 'ready';
    timeLeft = READY_TIME;
    startTick();
  } else if (phase === 'ready' || phase === 'exercise' || phase === 'rest') {
    pausedPhase = phase;
    phase = 'paused';
    clearInterval(timerId); timerId = null;
    updateTimer();
  } else if (phase === 'paused') {
    phase = pausedPhase;
    startTick();
  }
}

function startTick() {
  clearInterval(timerId);
  updateTimer();
  timerId = setInterval(tick, 1000);
}

function tick() {
  timeLeft--;
  if (timeLeft <= 0) {
    if (phase === 'ready') {
      // 준비 끝 → 운동 시작 (벨)
      phase = 'exercise';
      timeLeft = EX_TIME;
      beep();
    } else if (phase === 'exercise') {
      curSet++;
      updateDots();
      if (curSet >= TOTAL_SETS) {
        // 모든 세트 완료 (벨) → 다음 운동
        beep();
        clearInterval(timerId); timerId = null;
        curSet = 0;
        curEx++;
        if (curEx >= EXERCISES.length) {
          showCompletion(); return;
        }
        phase = 'idle';
        timeLeft = READY_TIME;
        render();
        // 1초 후 자동으로 준비 시작
        setTimeout(() => {
          phase = 'ready';
          timeLeft = READY_TIME;
          startTick();
        }, 1000);
        return;
      }
      // 세트 끝 → 휴식 (벨)
      phase = 'rest';
      timeLeft = REST_TIME;
      beep();
    } else if (phase === 'rest') {
      // 휴식 끝 → 운동 시작 (벨)
      phase = 'exercise';
      timeLeft = EX_TIME;
      beep();
    }
  }
  updateTimer();
  updateDots();
}

// ── navigation ────────────────────────────────────────────────────────────────
function navEx(dir) {
  if (phase !== 'idle') return;
  const next = curEx + dir;
  if (next < 0 || next >= EXERCISES.length) return;
  clearInterval(timerId); timerId = null;
  curEx = next; curSet = 0; timeLeft = EX_TIME;
  render();
}

// ── completion ────────────────────────────────────────────────────────────────
function showCompletion() {
  phase = 'idle';
  document.getElementById('mainView').style.display  = 'none';
  document.getElementById('chipRow').style.display   = 'none';
  document.getElementById('completionView').classList.add('show');
}

function resetAll() {
  clearInterval(timerId); timerId = null;
  curEx = 0; curSet = 0; phase = 'idle'; timeLeft = EX_TIME;
  document.getElementById('mainView').style.display  = '';
  document.getElementById('chipRow').style.display   = '';
  document.getElementById('completionView').classList.remove('show');
  render();
}

// ── init ──────────────────────────────────────────────────────────────────────
buildChips();
render();
</script>
